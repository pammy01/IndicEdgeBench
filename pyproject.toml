[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indicedgebench"
version = "0.1.0"
description = "Quality vs. efficiency of quantized small LLMs on Indic-language tasks, measured on commodity CPUs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
indicedgebench = "indicedgebench.cli:main"

[tool.setuptools]
packages = ["indicedgebench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
